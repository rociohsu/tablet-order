<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桌邊點餐｜王品集團</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/menu.css">
</head>
<body><main class="screen menu-screen">
<header class="brand-bar"><img src="assets/logo.png" alt="王品集團 wowprime"><nav class="header-actions" aria-label="用餐服務">
<button class="header-action" data-header-action="會員"><img src="assets/icons/Icon_user.svg" alt="">會員</button>
<button class="header-action" data-header-action="滿意度問卷"><img src="assets/icons/Icon_survey.svg" alt="">滿意度問卷</button>
<button class="header-action" data-header-action="點餐記錄"><img src="assets/icons/Icon_list.svg" alt="">點餐記錄</button>
<button class="header-action service-bell visible" id="service-bell" aria-haspopup="dialog"><img src="assets/icons/Icon_service-bell.svg" alt="">服務鈴</button>
<button class="header-action" id="language-button" aria-haspopup="dialog"><img src="assets/icons/Icon_earth.svg" alt=""><span id="language-label">中文</span></button>
</nav></header>
<div class="menu-body">
<div class="category-bar"><button id="category-prev" class="category-arrow" aria-label="向左捲動分類"><img src="assets/icons/Icon_dropdown-right.svg" alt=""></button><nav id="categories" aria-label="餐點分類"></nav><button id="category-next" class="category-arrow" aria-label="向右捲動分類"><img src="assets/icons/Icon_dropdown-right.svg" alt=""></button></div><div class="menu-scroll" id="menu-list"></div><footer class="order-status-bar" aria-label="目前用餐資訊"><dl class="table-summary"><div><dt>桌號</dt><dd id="status-table">未開桌</dd></div><div><dt>方案</dt><dd id="status-plan">—</dd></div><div><dt>人數</dt><dd id="status-people">—</dd></div></dl><dl class="time-summary"><div><dt>開桌時間</dt><dd id="status-opened">—</dd></div><div><dt>最後加點</dt><dd id="status-last">—</dd></div><div><dt>結束時間</dt><dd id="status-end">—</dd></div><div><dt>下次可送單時間</dt><dd id="status-next">—</dd></div></dl><button id="view-cart" class="view-cart"><span>查看購物車</span><span id="cart-count" aria-live="polite">0</span></button></footer></div>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-layout"><div class="detail-summary"><img class="dish-photo" src="assets/menu.jpg" alt=""><div class="dish-copy"><p class="eyebrow" id="detail-category"></p><h2 id="detail-title"></h2><p id="detail-description"></p></div></div><div class="detail-options"><button class="close-button" id="close-detail" aria-label="關閉商品詳情"><img src="assets/icons/Icon_close.svg" alt=""></button><div class="options-scroll"><div class="detail-product-heading"><h2 id="detail-option-title"></h2><strong id="detail-price"></strong></div><section class="flavor-section" aria-label="口味與自訂備註"><div class="flavor-options" aria-label="口味選擇"><button type="button" class="flavor-option" data-flavor="加辣" aria-pressed="false">加辣</button><button type="button" class="flavor-option" data-flavor="不要香菜" aria-pressed="false">不要香菜</button><button type="button" class="flavor-option" id="custom-flavor" aria-pressed="false" aria-expanded="false" aria-controls="meal-note">+自訂備註</button></div><textarea id="meal-note" maxlength="200" placeholder="請輸入備註" aria-label="自訂口味備註" hidden></textarea></section><div id="option-groups"></div></div></div></div><footer class="detail-footer"><div class="stepper"><button id="minus" aria-label="減少餐點數量">−</button><output id="quantity">1</output><button id="plus" aria-label="增加餐點數量">＋</button></div><div class="detail-feedback"><p id="validation" aria-live="polite"></p><p id="detail-limit" aria-label="點餐份數限制"></p></div><button id="add-cart" class="add-cart"></button></footer></dialog>
<dialog id="service-dialog" aria-labelledby="service-title"><button class="close-button" id="close-service" aria-label="關閉服務鈴選單"><img src="assets/icons/Icon_close.svg" alt=""></button><h2 id="service-title">服務鈴</h2><div class="service-options"></div><button class="service-confirm" id="confirm-service" disabled>確定</button></dialog>
<dialog id="language-dialog" aria-labelledby="language-title"><button class="close-button" id="close-language" aria-label="關閉語言選擇"><img src="assets/icons/Icon_close.svg" alt=""></button><h2 id="language-title">語言選擇</h2><div class="service-options" aria-label="語言"><button class="service-option" data-language="zh-Hant" aria-pressed="false">中文</button><button class="service-option" data-language="en" aria-pressed="false">English</button><button class="service-option" data-language="ja" aria-pressed="false">日本語</button></div><button class="service-confirm" id="confirm-language" disabled>確定</button></dialog>
<div id="menu-toast" role="status" aria-live="polite"></div><script src="js/menu.js"></script>
</body></html>
