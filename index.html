<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌邊自助點餐系統 | TableTap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="screen" id="app" aria-label="桌邊自助點餐系統 prototype">
      <header class="brand-bar">
        <img src="assets/logo.png" alt="王品集團" />
        <h1 class="header-title" id="header-title">後台管理</h1>
        <span class="header-version" id="header-version">版本: 123.45.67</span>
        <button class="service-bell" id="service-bell" type="button" aria-label="服務鈴">
          <img src="assets/icons/Icon_service-bell.svg" alt="" aria-hidden="true" />
          <span>服務鈴</span>
        </button>
      </header>
      <section id="view" class="view"></section>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
